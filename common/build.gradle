architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/vanillabackport.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "flatDir:Platform-common-1.20.1-$rootProject.platform_indev_version"
//    modImplementation "com.blackgear:Platform-common:$rootProject.platform_indev_version"
//    modImplementation "curse.maven:platform-997634:$rootProject.platform_fabric_version"
//    modImplementation "maven.modrinth:platform:1.3-fabric,1.20.1"
//    modImplementation "maven.modrinth:biolith:1.0.1-alpha.1-fabric,1.20.1"

    modCompileOnly "maven.modrinth:moonlight:1.20-2.16.34-fabric"
    modCompileOnly "maven.modrinth:every-compat:1.20-2.9.24-fabric"
    modCompileOnly "maven.modrinth:stone-zone:1.20-2.9.10-fabric"

    modCompileOnly "curse.maven:mouse-tweaks-60089:5230279"
    modCompileOnly "curse.maven:jei-238222:7253589"
    modCompileOnly "curse.maven:just-enough-resources-jer-240630:5057223"

    modCompileOnly "maven.modrinth:terrablender:3.0.1.10-fabric"
}
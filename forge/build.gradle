plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "vanillabackport.mixins.json"
        mixinConfig "vanillabackport.forge.mixins.json"
    }
}

sourceSets.main.resources.srcDirs += project(":common").file("src/main/generated")

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
//    modImplementation "flatDir:Platform-forge-1.20.1-$rootProject.platform_indev_version"
//    modImplementation "com.blackgear:Platform-forge:$rootProject.platform_indev_version"
//    modImplementation "maven.modrinth:platform:1.3-forge,1.20.1"

    def platformDependency = "flatDir:Platform-forge-1.20.1-$rootProject.platform_indev_version"
    modImplementation platformDependency

    if (platformDependency.startsWith("flatDir:")) {
        implementation "io.github.llamalad7:mixinextras-forge:0.5.0"
        annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.0"
    }

    modCompileOnly("curse.maven:mouse-tweaks-60089:5338457")
    modCompileOnly("curse.maven:jei-238222:7253590")
    modCompileOnly("curse.maven:just-enough-resources-jer-240630:5057220")

    modCompileOnly "maven.modrinth:moonlight:1.20-2.16.34-forge"
    modCompileOnly "maven.modrinth:every-compat:1.20-2.9.24-forge"

    modCompileOnly "maven.modrinth:terrablender:3.0.1.10-forge"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    exclude "architectury.common.json"
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

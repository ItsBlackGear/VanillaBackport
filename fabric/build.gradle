plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        datagen {
            inherit client

            name "Data Generation"

            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=vanillabackport"

            runDir "build/datagen"
        }
    }
}

sourceSets.main.resources.srcDirs += project(":common").file("src/main/generated")

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "flatDir:Platform-fabric-1.20.1-$rootProject.platform_indev_version"
//    modImplementation "com.blackgear:Platform-fabric:$rootProject.platform_indev_version"
//    modImplementation "curse.maven:platform-997634:$rootProject.platform_fabric_version"
//    modImplementation "maven.modrinth:platform:1.3-fabric,1.20.1"
//    modImplementation "maven.modrinth:biolith:1.0.1-alpha.1-fabric,1.20.1"

    modCompileOnly "curse.maven:mouse-tweaks-60089:5230279"
    modCompileOnly "curse.maven:jei-238222:7253589"
    modCompileOnly "curse.maven:just-enough-resources-jer-240630:5057223"

//    modRuntimeOnly "maven.modrinth:ksyxis:1.3.4"
//    modRuntimeOnly "maven.modrinth:immediatelyfast:1.5.4+1.20.4-fabric"
//    modRuntimeOnly "maven.modrinth:modernfix:5.25.2+mc1.20.1-fabric"

    modCompileOnly "maven.modrinth:moonlight:1.20-2.16.34-fabric"
    modCompileOnly "maven.modrinth:every-compat:1.20-2.9.24-fabric"
    modCompileOnly "maven.modrinth:terrablender:3.0.1.10-fabric"

    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixin_squared_version}")))

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
}
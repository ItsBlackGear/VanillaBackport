modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/ItsBlackGear/VanillaBackport/issues"
license = "https://github.com/ItsBlackGear/VanillaBackport/blob/1.20.1/LICENSE.txt"

[[mods]]
modId = "vanillabackport"
    version = "${version}"
    displayName = "VanillaBackport"
    authors = "BlackGear"
    description = "Backporting Minecraft Features to previous versions!"
    logoFile = "icon.png"

[[dependencies.vanillabackport]]
    modId = "neoforge"
    event = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.vanillabackport]]
    modId = "minecraft"
    event = "required"
    versionRange = "[1.21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.vanillabackport]]
    modId = "platform"
    event = "required"
    versionRange = "[1.4,)"
    ordering = "NONE"
    side = "BOTH"

[[mixins]]
    config = "vanillabackport.mixins.json"
[[mixins]]
    config = "vanillabackport-neoforge.mixins.json"

["badoptimizations:cache_hooks"]
    common = "com.blackgear.vanillabackport.client.api.modules.end_flashes.BadOptimizationsCommonHook"